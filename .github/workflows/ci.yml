# CI for the skintones repo:
# - Rust: format check, clippy (warnings = error), tests, release build
# - Python: unit tests (integration tests need the Rust binary, so it is built first)
name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release

  python:
    name: Python (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Rust toolchain (for the binary)
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust binary (integration tests need it)
        run: cargo build --release
        working-directory: rust
      - name: Unit tests
        run: python -m unittest discover -s tests -v
